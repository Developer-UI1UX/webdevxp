name: Deploy Harx Pay to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        env:
          HARX_API_BASE_URL: ${{ vars.HARX_API_BASE_URL }}
        run: |
          mkdir -p _site
          cp index.html app.js styles.css api-client.js _site/
          node - <<'NODE'
          const fs = require("node:fs");
          const apiBase = process.env.HARX_API_BASE_URL || "";
          if (apiBase) {
            const parsed = new URL(apiBase);
            if (parsed.protocol !== "https:" || !parsed.pathname.replace(/\/+$/, "").endsWith("/api")) {
              throw new Error("HARX_API_BASE_URL must be an HTTPS URL ending in /api");
            }
          }
          fs.writeFileSync(
            "_site/config.js",
            `window.HARX_CONFIG = Object.freeze({ apiBaseUrl: ${JSON.stringify(apiBase)} });\n`
          );
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
